# 配置文件版本号
version: 5.1.0
# Icarus主题变体，可选"default"或"cyberpunk"
variant: default
# 网站Logo的路径或URL（支持浅色/深色模式不同图片）
logo:
    light: /img/35d454d013558.png
    dark: /img/35d454d013558.png

# 页面元数据配置
head:
    # 网站图标(favicon)的路径或URL
    favicon: /favicon.ico
    # 当前页面的规范URL（用于SEO）
    #canonical_url:
    
    # Open Graph元数据配置（社交媒体分享预览）
    # https://hexo.io/docs/helpers.html#open-graph
    #open_graph:
        # 页面标题(og:title)（可选，通常留空使用页面默认标题）
        #title:
        # 页面类型(og:type)（可选，通常留空）
        #type: blog
        # 页面URL(og:url)（可选，通常留空）
        #url:
        # 页面封面图(og:image)（可选，默认使用文章缩略图）
        #image:
        # 网站名称(og:site_name)（可选，通常留空）
        #site_name:
        # 页面作者(article:author)（可选，通常留空）
        #author:
        # 页面描述(og:description)（可选，通常留空）
        #description:
        # Twitter卡片类型(twitter:card)
        #twitter_card:
        # Twitter作者ID(twitter:creator)
        #twitter_id:
        # Twitter网站ID(twitter:site)
        #twitter_site:
        # Google+个人资料链接（已弃用）
        #google_plus:
        # Facebook管理员ID
        #fb_admins:
        # Facebook应用ID
        #fb_app_id:
    
    # 页面结构化数据配置（SEO优化）
    # https://developers.google.com/search/docs/guides/intro-structured-data
    structured_data:
        # 页面标题（可选，通常留空）
        title:
        # 页面描述（可选，通常留空）
        description:
        # 页面URL（可选，通常留空）
        url:
        # 页面作者（可选，通常留空）
        author:
        # 页面图片（可选，默认使用Open Graph图片或文章缩略图）
        image:
    
    # 额外的HTML meta标签配置（数组形式）
    meta:
        # 按<属性>=<值>格式指定meta标签
        # 例如：name=theme-color;content=#123456 => <meta name="theme-color" content="#123456">
        - ''
    
    # 网站RSS feed(atom.xml)的路径或URL
    rss: /atom.xml

# 页面顶部导航栏配置
navbar:
    # 导航菜单项（名称: 链接）
    menu:
        首页: /
        时间轴: /archives/
        分类: /categories/
        标签: /tags/
        网盘: 'https://imaegoo.azurewebsites.net'
        留言板: /messages/
        友情链接: /friends/
        关于: /about/
    
    # 显示在导航栏右侧的链接
    links:
        # Admin:
        #     icon: fas fa-cog
        #     url: 'https://admin.imaegoo.com'

# 页面页脚配置
footer:
    # 显示在页脚右侧的链接
    links:
        Creative Commons:
            icon: fab fa-creative-commons
            url: 'https://creativecommons.org/'
        Attribution 4.0 International:
            icon: fab fa-creative-commons-by
            url: 'https://creativecommons.org/licenses/by/4.0/deed.zh'
    
    # 版权信息（支持HTML）
    copyright: '<a href="https://beian.mps.gov.cn/#/query/webSearch?code=41010502005985" rel="noreferrer" target="_blank">豫公网安备41010502005985</a>&nbsp;&nbsp;<a href="https://beian.miit.gov.cn" target="_blank" rel="noreferrer noopener">豫ICP备18017229号</a>'

# 文章相关配置
article:
    # 代码高亮设置
    highlight:
        # 代码高亮主题
        # https://github.com/highlightjs/highlight.js/tree/master/src/styles
        theme: atom-one-light
        # 是否显示复制代码按钮
        clipboard: true
        # 代码块的默认折叠状态：""（不折叠）、"folded"（折叠）、"unfolded"（展开）
        fold: unfolded
    
    # 是否为每篇文章显示缩略图
    thumbnail: true
    # 是否显示预计阅读时间
    readtime: true
    # 是否显示更新时间："auto"（仅当page.updated设置且与page.date不同时显示）
    update_time: auto
    
    # 文章许可声明块
    licenses:
        Creative Commons:
            icon: fab fa-creative-commons
            url: 'https://creativecommons.org/'
        'CC BY 4.0': 'https://creativecommons.org/licenses/by/4.0/deed.zh'
    
    # 默认的Open Graph分享图片
    og_image: /images/og_image.png

# 搜索插件配置
# https://ppoffice.github.io/hexo-theme-icarus/categories/Plugins/Search/
search:
    # 搜索插件类型
    type: insight
    # 搜索索引数据文件路径
    json: /content.json

# 评论插件配置
# https://ppoffice.github.io/hexo-theme-icarus/categories/Plugins/Comment/
comment:
    # 评论插件名称
    type: twikoo
    # Twikoo环境ID
    env_id: https://twikoo.imaegoo.com
    # Twikoo JS文件URL
    js_url: /js/imaegoo/twikoo/1.6.31/twikoo.min.js
    
    # 可选：Utterances评论系统配置（GitHub Issues基于）
    # type: utterances
    # repo: imaegoo/imaegoo.github.io
    # issue_term: pathname
    # label: utterances
    # theme: preferred-color-scheme

# 捐赠功能配置
donates:
    # 支付宝捐赠按钮配置
    -
        type: alipay
        # 支付宝收款二维码图片URL
        qrcode: '/images/alipay.jpg'
    
    # 微信捐赠按钮配置
    -
        type: wechat
        # 微信收款二维码图片URL
        qrcode: '/images/wechat.png'

# 分享插件配置（当前未启用）
# https://ppoffice.github.io/hexo-theme-icarus/categories/Plugins/Share/

# 侧边栏配置
# 注意：只有当侧边栏至少有一个小工具时才会显示
sidebar:
    # 左侧边栏配置
    left:
        # 页面滚动时侧边栏是否固定顶部
        sticky: true
    
    # 右侧边栏配置
    right:
        # 页面滚动时侧边栏是否固定顶部
        sticky: true

# 侧边栏小工具配置
# http://ppoffice.github.io/hexo-theme-icarus/categories/Widgets/
widgets:
    # 个人资料小工具配置
    -
        # 小工具位置：left（左侧）或right（右侧）
        position: left
        type: profile
        # 作者姓名
        author: Na11Cat
        # 作者头衔/描述
        author_title: VENI VIDI VICI
        # 作者所在地
        location: HuNan, China
        # 头像图片路径或URL
        avatar: /img/avatar.png
        # 是否显示圆形头像
        avatar_rounded: true
        # Gravatar邮箱地址
        gravatar:
        # 关注按钮的链接地址
        follow_link: https://github.com/Nu11Cat
        # 个人资料底部显示的社交链接
        social_links:
            GitHub:
                icon: fab fa-github
                url: 'https://github.com/Nu11Cat'
            QQ:
                icon: fab fa-qq
                url: 'https://jq.qq.com/?_wv=1027&k=2l9ZGIoL'
            Mail:
                icon: fas fa-envelope
                url: 'mailto:hello@imaegoo.com'
            RSS:
                icon: fas fa-rss
                url: '/atom.xml'
    
    # 归档小工具配置
    -
        position: left
        type: archives
        # 归档分组方式：monthly（按月）
        group_by: monthly
        # 归档日期显示格式
        format: 'YYYY 年 M 月'
    
    # 分类小工具配置（当前未启用）
    #-
    #    position: left
    #    type: categories
    
    # 标签小工具配置（当前未启用）
    -
        position: left
        type: tags
    
    # 推荐链接小工具配置（当前未启用）
    #-
    #    position: left
    #    type: links
    #    # 网站名称和URL映射
    #    links:
    #        maemoの風船が！: 'https://maemo.cc'
    #        米米的博客: 'https://zhangshuqiao.org'
    #        辣椒の酱: 'https://removeif.github.io'
    #        Sakitami的集装箱: 'https://blog.skihome.xyz'
    #        明月逐人归: 'https://mingshan.fun'
    #        宇宙湾: 'https://yuzhouwan.com'
    #        Ray’s Blog: 'https://raycoder.me'
    
    # Google AdSense广告单元配置（当前未启用）
    #-
    #    position: left
    #    type: adsense
    #    # AdSense客户ID
    #    client_id: 'ca-pub-5716633754544549'
    #    # AdSense广告单元ID
    #    slot_id: '6035187824'
    
    # 文章目录小工具配置
    -
        position: right
        type: toc
    
    # 最新文章小工具配置
    -
        position: right
        type: recent_posts
        # 显示的文章数量限制
        limit: 5
    
    # Twikoo最新评论小工具配置
    -
        position: right
        type: twikoo_new
        # Twikoo环境ID
        env_id: https://twikoo.imaegoo.com

# 插件配置
plugins:
    # 是否启用页面启动动画
    animejs: false
    # 是否显示"返回顶部"按钮
    back_to_top: true
    # 是否启用Netlify身份验证
    netlify: false
    
    # 百度统计配置
    # https://tongji.baidu.com
    baidu_analytics:
        # 百度统计跟踪ID
        tracking_id: # 4d5b97d11341c6f57b58fc622dc1ac38
    
    # 不蒜子网站访问计数器
    # https://busuanzi.ibruce.info
    busuanzi: true
    
    # 是否启用lightGallery和Justified Gallery相册插件
    # https://ppoffice.github.io/hexo-theme-icarus/Plugins/General/gallery-plugin/
    gallery: true
    
    # Google Analytics配置
    # https://analytics.google.com
    google_analytics:
        # Google Analytics跟踪ID
        tracking_id: G-RCCCLYKRH5
    
    # Hotjar用户反馈插件配置
    # https://www.hotjar.com/
    hotjar:
        # Hotjar网站ID
        site_id:
    
    # 是否启用KaTeX数学公式渲染
    # https://katex.org/
    katex: false
    
    # 是否启用MathJax数学公式渲染
    # https://www.mathjax.org/
    mathjax: false
    
    # 是否启用过时浏览器提示插件
    # http://outdatedbrowser.com/
    outdated_browser: false
    
    # 是否在页面加载时显示顶部进度条
    progressbar: false
    
    # Cookie同意对话框配置
    cookie_consent:
        # 同意对话框类型："info"（信息）、"opt-in"（选择加入）、"opt-out"（选择退出）
        type: info
        # 弹出框主题："block"（块状）、"edgeless"（无边框）、"classic"（经典）
        theme: edgeless
        # 是否固定弹出框（不随页面滚动）
        static: false
        # 弹出框在屏幕上的位置
        position: bottom-right
        # 网站Cookie政策页面URL
        policyLink: '/cookies/'

# CDN提供商配置
# https://ppoffice.github.io/hexo-theme-icarus/Configuration/Theme/speed-up-your-site-with-custom-cdn/
providers:
    # JavaScript和样式表的CDN提供商名称或URL模板
    cdn: host
    # 网络字体的CDN提供商名称或URL模板
    fontcdn: host
    # FontAwesome图标字体的CDN提供商名称或URL
    iconcdn: host